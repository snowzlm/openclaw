name: reproduce-openai-responses-89728-family

on:
  push:
    branches:
      - analysis/89728-actions-repro
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CI: true

jobs:
  secondary-reproduction:
    name: Secondary reproduction matrix (#89728 family)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install dependencies for direct code-path reproduction
        run: pnpm install --frozen-lockfile
      - name: Run fixture/source reproduction matrix
        run: node scripts/repro/openai-responses-compat-regressions.mjs
      - name: Run direct OpenClaw code-path reproduction matrix
        run: pnpm exec tsx scripts/repro/openai-responses-codepath-regressions.ts
      - name: Run strict repeat retest for #90094
        run: pnpm exec tsx scripts/repro/openai-responses-strict-retest.ts
      - name: Run gap closure retest
        run: pnpm exec tsx scripts/repro/openai-responses-gap-closure.ts
      - name: Print fixture/source markdown report
        run: cat artifacts/repro/openai-responses-compat-regressions.md
      - name: Print direct code-path markdown report
        run: cat artifacts/repro/openai-responses-codepath-regressions.md
      - name: Upload reproduction reports
        uses: actions/upload-artifact@v4
        with:
          name: openai-responses-89728-secondary-reproduction
          path: artifacts/repro/
